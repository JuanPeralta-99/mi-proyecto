name: CI - Full Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-test-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1️⃣ Checkout del repositorio
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2️⃣ Setup Node.js
      # ---------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------
      # 3️⃣ Instalar dependencias
      # ---------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------------
      # 4️⃣ Instalar Playwright navegadores
      # ---------------------------
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # ---------------------------
      # 5️⃣ Iniciar backend en segundo plano
      # ---------------------------
      - name: Start backend
        working-directory: backend
        run: nohup npm run dev &> backend.log &

      # ---------------------------
      # 6️⃣ Esperar a que backend esté listo
      # ---------------------------
      - name: Wait for backend
        working-directory: frontend
        run: npx wait-on http://localhost:4000 --timeout 30000

      # ---------------------------
      # 7️⃣ Iniciar frontend en segundo plano
      # ---------------------------
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev &> frontend.log &

      # ---------------------------
      # 8️⃣ Esperar a que frontend esté listo
      # ---------------------------
      - name: Wait for frontend
        working-directory: frontend
        run: npx wait-on http://localhost:3000 --timeout 30000

      # ---------------------------
      # 9️⃣ Ejecutar backend tests
      # ---------------------------
      - name: Run backend tests
        working-directory: backend
        run: npm test

      # ---------------------------
      # 🔟 Ejecutar frontend unit tests (Vitest)
      # ---------------------------
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

      # ---------------------------
      # 1️⃣1️⃣ Ejecutar Playwright E2E
      # ---------------------------
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list

      # ---------------------------
      # 1️⃣2️⃣ Setup Python para Locust (opcional)
      # ---------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust

      # ---------------------------
      # 1️⃣3️⃣ Ejecutar pruebas de carga Locust (opcional)
      # ---------------------------
      - name: Run load tests
        working-directory: backend
        run: |
          locust -f locustfile.py --headless -u 5 -r 1 -t 30s --host=http://localhost:4000
