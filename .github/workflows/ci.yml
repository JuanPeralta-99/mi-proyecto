name: CI - Full Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-test-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1️⃣ Checkout del repositorio
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2️⃣ Configurar Node.js
      # ---------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------
      # 3️⃣ Instalar dependencias backend y frontend
      # ---------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------------
      # 4️⃣ Instalar Playwright browsers
      # ---------------------------
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # ---------------------------
      # 5️⃣ Instalar herramientas globales y dar permisos
      # ---------------------------
      - name: Install concurrently & wait-on
        run: npm install --save-dev concurrently wait-on

      - name: Dar permisos de ejecución
        run: chmod +x ./node_modules/.bin/concurrently ./node_modules/.bin/wait-on

      # ---------------------------
      # 6️⃣ Iniciar backend + frontend y esperar
      # ---------------------------
      - name: Start backend + frontend
        run: |
          npx concurrently -k -n BACKEND,FRONTEND "npm run dev --prefix backend" "npm run dev --prefix frontend" &
          npx wait-on http://localhost:4000 http://localhost:3000 --timeout 90000

      # ---------------------------
      # 7️⃣ Ejecutar pruebas backend
      # ---------------------------
      - name: Run backend tests
        working-directory: backend
        run: npm test

      # ---------------------------
      # 8️⃣ Ejecutar pruebas frontend (Vitest)
      # ---------------------------
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

      # ---------------------------
      # 9️⃣ Ejecutar pruebas E2E (Playwright)
      # ---------------------------
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list

      # ---------------------------
      # 🔟 Instalar y ejecutar Locust (pruebas de carga)
      # ---------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust

      - name: Run load tests
        working-directory: backend
        run: |
          locust -f locustfile.py --headless -u 5 -r 1 -t 30s --host=http://localhost:4000
