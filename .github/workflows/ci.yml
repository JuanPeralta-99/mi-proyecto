name: CI - Full Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-test-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # 5️⃣ Start backend + frontend con concurrently y esperar a que estén listos
      - name: Start backend + frontend
        run: |
          npm install --save-dev concurrently wait-on
          npx concurrently -k -n BACKEND,FRONTEND "npm run dev --prefix backend" "npm run dev --prefix frontend" &
          npx wait-on http://localhost:4000 http://localhost:3000 --timeout 60000

      # 6️⃣ Ejecutar backend tests
      - name: Run backend tests
        working-directory: backend
        run: npm test

      # 7️⃣ Ejecutar frontend unit tests (Vitest)
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

      # 8️⃣ Ejecutar Playwright E2E
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list

      # 9️⃣ Setup Python y Locust
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Locust
        run: pip install locust

      # 🔟 Ejecutar pruebas de carga Locust
      - name: Run load tests
        working-directory: backend
        run: |
          locust -f locustfile.py --headless -u 5 -r 1 -t 30s --host=http://localhost:4000
